# Checkout + Node + pnpm (com cache do store) + install
steps:
  - checkout: self
    fetchDepth: 1

  - task: NodeTool@0
    displayName: Node.js $(NODE_VERSION)
    inputs:
      versionSpec: $(NODE_VERSION)

  - script: npm install -g pnpm@$(PNPM_VERSION) && pnpm --version
    displayName: pnpm $(PNPM_VERSION)

  - task: Cache@2
    displayName: Cache do pnpm store
    inputs:
      key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
      restoreKeys: |
        pnpm | "$(Agent.OS)"
      path: $(PNPM_STORE)

  - script: |
      pnpm config set store-dir $(PNPM_STORE)
      pnpm install --frozen-lockfile
    displayName: pnpm install
    env:
      HUSKY: '0'
