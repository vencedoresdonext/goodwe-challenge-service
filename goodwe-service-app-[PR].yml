# ============================================================
#  NestJS / TypeScript
#  Fluxo: install → build → test (apenas em Pull Requests)
# ============================================================

trigger: none

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: GitHub-Sync-Vars
  - name: NODE_VERSION
    value: '24.16'
  - name: PNPM_VERSION
    value: '11.6'

stages:

# ──────────────────────────────────────────────
# CI: Build + Testes (executado em PRs)
# ──────────────────────────────────────────────
- stage: CI
  displayName: 'Build & Testes (NestJS)'
  jobs:
  - job: BuildAndTest
    displayName: 'Install → Build → Test'
    steps:

    # Checkout completo
    - checkout: self
      fetchDepth: 0

    # Instala Node.js
    - task: NodeTool@0
      displayName: 'Instalar Node.js $(NODE_VERSION)'
      inputs:
        versionSpec: '$(NODE_VERSION).x'

    # Instala pnpm
    - script: |
        corepack enable
        corepack prepare pnpm@$(PNPM_VERSION) --activate
        pnpm --version
      displayName: 'Ativar pnpm $(PNPM_VERSION)'

    # Cache do store do pnpm
    - task: Cache@2
      displayName: 'Cache pnpm store'
      inputs:
        key: 'pnpm | "$(Agent.OS)" | pnpm-lock.yaml'
        restoreKeys: |
          pnpm | "$(Agent.OS)"
        path: $(Pipeline.Workspace)/.pnpm-store

    # Instala dependências
    - script: |
        pnpm config set store-dir $(Pipeline.Workspace)/.pnpm-store
        pnpm install --frozen-lockfile
      displayName: 'pnpm install'

    # Build de produção
    - script: pnpm run build
      displayName: 'pnpm build'

    # Testes unitários + cobertura
    - script: pnpm run test -- --coverage --ci
      displayName: 'pnpm test'

    # Publica cobertura de código
    - task: PublishCodeCoverageResults@2
      displayName: 'Publicar cobertura'
      condition: always()
      inputs:
        summaryFileLocation: '**/coverage/cobertura-coverage.xml'