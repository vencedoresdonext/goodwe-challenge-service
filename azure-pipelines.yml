# ════════════════════════════════════════════════════════════
#  NestJS / TypeScript
#  Fluxo: install → build → test → espelhar para GitHub
# ════════════════════════════════════════════════════════════

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: GitHub-Sync-Vars
  - name: NODE_VERSION
    value: '24.16.0'
  - name: PNPM_VERSION
    value: '11.6.0'
  - name: PNPM_STORE
    value: $(Pipeline.Workspace)/.pnpm-store

resources:
  containers:
    - container: mysql
      image: mysql:8.4
      ports: ['3306:3306']
      env:
        MYSQL_ROOT_PASSWORD: ci-password
        MYSQL_DATABASE: goodwe_test
    - container: redis
      image: redis:7.4-alpine
      ports: ['6379:6379']

stages:
  # =================================================
  - stage: CI
    displayName: Integração contínua
    jobs:
      - job: Quality
        displayName: Lint · Typecheck · Unit · Build
        variables:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci # só para o Prisma CLI
        steps:
          - template: .azure/templates/setup-node.yml

          - script: pnpm prisma validate && pnpm prisma generate
            displayName: Prisma validate + generate

          - script: pnpm lint && pnpm format:check
            displayName: Lint + Prettier

          - script: pnpm typecheck
            displayName: Typecheck

          - script: pnpm test:ci
            displayName: Testes unitários

          - script: pnpm build
            displayName: Build

          - task: PublishTestResults@2
            displayName: Publicar resultados (unit)
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: tests/results/unit-junit.xml
              testRunTitle: Unit

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

  # =================================================
  - stage: Docker
    displayName: Imagem Docker
    dependsOn: CI
    jobs:
      - job: Build
        displayName: docker build (runtime)
        steps:
          - script: |
              DOCKER_BUILDKIT=1 docker build \
                -f docker/node/Dockerfile \
                --target runtime \
                --build-arg NODE_VERSION=$(NODE_VERSION) \
                --build-arg PNPM_VERSION=$(PNPM_VERSION) \
                -t goodwe-service-app:$(Build.BuildId) .
            displayName: Build da imagem

  # =================================================
  - stage: Mirror
    displayName: Espelhar para GitHub
    dependsOn: Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: MirrorToGitHub
        displayName: git push → GitHub
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - script: |
              set -e
              git config user.email "vencedoresdonext@gmail.com"
              git config user.name  "vencedoresdonext"
              git remote add github "https://$(GITHUB_PAT)@github.com/$(GITHUB_USER)/$(GITHUB_REPO_BACKEND).git"
              git push github HEAD:refs/heads/main --force
            displayName: Push para GitHub
