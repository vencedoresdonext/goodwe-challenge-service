# ════════════════════════════════════════════════════════════
#  NestJS / TypeScript
#  Fluxo: install → build → test → espelhar para GitHub
# ════════════════════════════════════════════════════════════

trigger:
  branches:
    include: [main]

pr:
  branches:
    include: [main]

pool:
  vmImage: ubuntu-latest

variables:
  - group: GitHub-Sync-Vars
  - name: NODE_VERSION
    value: '24.16.0'
  - name: PNPM_VERSION
    value: '11.6.0'
  - name: PNPM_STORE
    value: $(Pipeline.Workspace)/.pnpm-store

resources:
  containers:
    - container: mysql
      image: mysql:8.4
      ports: ['3306:3306']
      env:
        MYSQL_ROOT_PASSWORD: ci-password
        MYSQL_DATABASE: goodwe_test
    - container: redis
      image: redis:7.4-alpine
      ports: ['6379:6379']

stages:
  # =================================================
  - stage: CI
    displayName: Integração contínua
    jobs:
      - job: Quality
        displayName: Lint · Typecheck · Unit · Build
        variables:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci # só para o Prisma CLI
        steps:
          - template: .azure/templates/setup-node.yml

          - script: pnpm prisma validate && pnpm prisma generate
            displayName: Prisma validate + generate

          - script: pnpm lint && pnpm format:check
            displayName: Lint + Prettier

          - script: pnpm typecheck
            displayName: Typecheck

          - script: pnpm test:ci
            displayName: Testes unitários

          - script: pnpm build
            displayName: Build

          - task: PublishTestResults@2
            displayName: Publicar resultados (unit)
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: tests/results/unit-junit.xml
              testRunTitle: Unit

          - task: PublishCodeCoverageResults@2
            displayName: Publicar cobertura
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: coverage/cobertura-coverage.xml

      - job: Integration
        displayName: Testes de integração (MySQL + Redis)
        services:
          mysql: mysql
          redis: redis
        variables:
          NODE_ENV: test
          DATABASE_URL: mysql://root:ci-password@localhost:3306/goodwe_test
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          JWT_APP_SECRET: ci-app-secret
          JWT_WEB_SECRET: ci-web-secret
          JWT_APP_REFRESH_SECRET: ci-app-refresh-secret
          JWT_WEB_REFRESH_SECRET: ci-web-refresh-secret
          TELEMETRY_API_URL: http://localhost:9999
        steps:
          - template: .azure/templates/setup-node.yml

          - script: |
              for i in $(seq 1 30); do
                docker exec $(docker ps -qf ancestor=mysql:8.4) mysqladmin ping -h127.0.0.1 -uroot -pci-password --silent && exit 0
                sleep 2
              done
              echo "MySQL não respondeu a tempo" && exit 1
            displayName: Aguardar MySQL

          - script: pnpm prisma generate && pnpm test:int:ci
            displayName: Testes de integração

          - task: PublishTestResults@2
            displayName: Publicar resultados (integração)
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: tests/results/int-junit.xml
              testRunTitle: Integração

  # =================================================
  - stage: Docker
    displayName: Imagem Docker
    dependsOn: CI
    jobs:
      - job: Build
        displayName: docker build (runtime)
        steps:
          - script: |
              DOCKER_BUILDKIT=1 docker build \
                -f docker/node/Dockerfile \
                --target runtime \
                --build-arg NODE_VERSION=$(NODE_VERSION) \
                --build-arg PNPM_VERSION=$(PNPM_VERSION) \
                -t goodwe-service-app:$(Build.BuildId) .
            displayName: Build da imagem

  # =================================================
  - stage: Mirror
    displayName: Espelhar para GitHub
    dependsOn: Docker
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - job: MirrorToGitHub
        displayName: git push → GitHub
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - script: |
              set -e
              git config user.email "vencedoresdonext@gmail.com"
              git config user.name  "vencedoresdonext"
              git remote add github "https://$(GITHUB_PAT)@github.com/$(GITHUB_USER)/$(GITHUB_REPO_BACKEND).git"
              git push github HEAD:refs/heads/main --force
            displayName: Push para GitHub
